        phone: "98765 12345",

        crop: "Wheat",
        weight: 50,

      const [scanInput, setScanInput] = useState("");
      const [scannedResultToken, setScannedResultToken] = useState(null);
      const [scanSuccessMsg, setScanSuccessMsg] = useState("");

      // Digital Quality Inspector Form State
      const [inspectionTokenId, setInspectionTokenId] = useState(INITIAL_TOKENS[0].id);
      const [qualityMetrics, setQualityMetrics] = useState({
        moisture: 11.5,
        foreignMatter: 0.8,
        damagedGrain: 0.5

      const [qualityApprovedMsg, setQualityApprovedMsg] = useState("");

      // Feature Phone SMS Simulator State
      const [smsInput, setSmsInput] = useState("BOOK WHEAT 50 12OCT");
      const [smsHistory, setSmsHistory] = useState([
        { sender: "system", text: "Welcome to e-Mandi SMS Booking. Reply BOOK <CROP> <WEIGHT_QUINTALS> <DATE> or STATUS <TOKEN_ID>.", time: "09:00 AM" }
      ]);

      // Live Clock
      const [currentTime, setCurrentTime] = useState(new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const t = TRANSLATIONS[lang];

      // Selected Token Object
      const activeToken = useMemo(() => {
        return tokens.find(tk => tk.id === selectedTokenId) || tokens[0];
      }, [tokens, selectedTokenId]);

      // Inspection Active Token Object
      const activeInspectionToken = useMemo(() => {
        return tokens.find(tk => tk.id === inspectionTokenId) || tokens[0];
      }, [tokens, inspectionTokenId]);

      // Calculate Dynamic Slot Capacity Percentage
      const currentSlotOccupancy = useMemo(() => {
        const bookedCount = tokens.filter(tk => tk.timeSlot === bookingForm.timeSlot && tk.crop === bookingForm.crop).length;
        const basePct = 62 + (bookedCount * 12);
        return Math.min(basePct, 98);
      }, [tokens, bookingForm.timeSlot, bookingForm.crop]);

      // Handle New Booking Submission
      const handleBookSlot = (e) => {
        e.preventDefault();
        const nextNum = 9840 + tokens.length + 1;
        const generatedId = `TKN-2026-${nextNum}`;
        const baseMsp = MSP_RATES[bookingForm.crop] || 2200;
        const estPayout = baseMsp * Number(bookingForm.weight);

        const newToken = {
          id: generatedId,
          farmerName: bookingForm.farmerName || "Farmer",
          phone: "+91 " + (bookingForm.phone || "99999 88888"),
          village: bookingForm.village || "Karnal",
          crop: bookingForm.crop,
          weight: Number(bookingForm.weight),
          date: bookingForm.date,
          timeSlot: bookingForm.timeSlot,
          gate: "Gate No. " + (Math.floor(Math.random() * 3) + 1),
          stage: 1, // Slot Booked
          estWaitMinutes: 25,
          queueNumber: bookingForm.crop[0] + "-0" + (tokens.length + 5),
          vehicleNo: "HR-05-X-" + Math.floor(1000 + Math.random() * 9000),
          moisture: 10.5,
          foreignMatter: 0.6,
          damagedGrain: 0.4,
          grade: "Grade A",
          baseMsp: baseMsp,
          penalty: 0,
          netPayout: estPayout,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setTokens([newToken, ...tokens]);
        setSelectedTokenId(generatedId);
        setNewlyCreatedToken(newToken);
      };

      // Quality Grade Calculation Logic
      const evaluatedGrade = useMemo(() => {
        const { moisture, foreignMatter, damagedGrain } = qualityMetrics;
        if (moisture > 15.0 || foreignMatter > 3.0 || damagedGrain > 4.0) {
          return { grade: "Rejected", penaltyPerQuintal: 0, statusClass: "bg-red-100 text-red-700 border-red-200" };
        } else if (moisture > 12.0 || foreignMatter > 1.2 || damagedGrain > 1.5) {
          const penalty = Math.round((moisture - 12.0) * 15 + (foreignMatter - 1.2) * 20);
          return { grade: "Standard", penaltyPerQuintal: Math.max(penalty, 15), statusClass: "bg-amber-100 text-amber-800 border-amber-200" };
        } else {
          return { grade: "Grade A", penaltyPerQuintal: 0, statusClass: "bg-emerald-100 text-emerald-800 border-emerald-200" };
        }
      }, [qualityMetrics]);

      // Handle Quality Inspection Approval & Stage Advancement
      const handleApproveQuality = () => {
        const baseMsp = activeInspectionToken.baseMsp;
        const penalty = evaluatedGrade.penaltyPerQuintal;
        const netPerQuintal = evaluatedGrade.grade === "Rejected" ? 0 : (baseMsp - penalty);
        const finalPayout = netPerQuintal * activeInspectionToken.weight;

        setTokens(prev => prev.map(tk => {
          if (tk.id === activeInspectionToken.id) {
            return {
              ...tk,
              stage: evaluatedGrade.grade === "Rejected" ? 1 : 5, // Advance to Stage 5 (Payment Initiated) or stay
              moisture: qualityMetrics.moisture,
              foreignMatter: qualityMetrics.foreignMatter,
              damagedGrain: qualityMetrics.damagedGrain,
              grade: evaluatedGrade.grade,
              penalty: penalty,
              netPayout: finalPayout
            };
          }
          return tk;
        }));

        setQualityApprovedMsg(`Token ${activeInspectionToken.id} Quality Inspected & ${evaluatedGrade.grade} Approved! Net Payout ₹${finalPayout.toLocaleString('en-IN')} queued for DBT.`);
        setTimeout(() => setQualityApprovedMsg(""), 5000);
      };

      // Handle SMS Simulator Action
      const handleSendSms = (e) => {
        e.preventDefault();
        if (!smsInput.trim()) return;

        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const userMsg = { sender: "user", text: smsInput, time: timeStr };
        let replyText = "";

        const inputUpper = smsInput.trim().toUpperCase();
        if (inputUpper.startsWith("BOOK")) {
          const parts = inputUpper.split(" ");
          const cropName = parts[1] || "WHEAT";
          const weightNum = parts[2] || "50";
          const newTokenId = `TKN-2026-${Math.floor(9846 + Math.random() * 500)}`;
          replyText = `SUCCESS! Slot Booked for ${cropName} (${weightNum} Qtl). Token: ${newTokenId}. Gate: Gate 2. Time: 08:00 AM - 10:00 AM. Est Wait: 15 mins. Present this SMS at gate.`;
        } else if (inputUpper.startsWith("STATUS")) {
          const parts = inputUpper.split(" ");
          const reqId = parts[1] || "TKN-2026-9842";
          const found = tokens.find(t => t.id.includes(reqId) || reqId.includes(t.id));
          if (found) {
            const stageLabels = ["Slot Booked", "Checked-In Gate", "Quality Inspection", "Weighbridge", "Payment Initiated", "DBT Disbursed"];
            replyText = `STATUS for ${found.id}: Current Stage: [${stageLabels[found.stage - 1]}]. Gate: ${found.gate}. Est Wait: ${found.estWaitMinutes} mins. Net Payout: Rs ${found.netPayout.toLocaleString('en-IN')}.`;

            replyText = `Token ${reqId} found! Current Stage: [Gate Checked-In]. Queue Position: #3. Please proceed to Inspection Bay 2.`;

        setSmsHistory([...smsHistory, userMsg, systemReply]);
        setSmsInput("");
      };

      // Handle Officer Gate Check-In Action
      const handleScanCheckIn = () => {
        const found = tokens.find(t => t.id.toLowerCase() === scanInput.trim().toLowerCase());
        if (found) {
          setScannedResultToken(found);
          // Update stage to Gate Checked-In (2) if it was 1

            setTokens(prev => prev.map(tk => tk.id === found.id ? { ...tk, stage: 2 } : tk));

        setTokens(prev => prev.map(tk => {

            return { ...tk, stage: nextStage };

                      />
                    </div>

                    {/* Foreign Matter Slider */}
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                      <div className="flex justify-between items-center text-xs font-bold">
                        <span className="text-slate-700">{t.foreignMatter} (Limit: &lt;1.2%):</span>
                        <span className="text-sm font-mono px-2 py-0.5 rounded bg-slate-200 text-slate-800">
                          {qualityMetrics.foreignMatter}%
                        </span>
                      </div>
                      <input 
                        type="range" 
                        min="0.0" 
                        max="5.0" 
                        step="0.1"
                        value={qualityMetrics.foreignMatter}
                        onChange={e => setQualityMetrics({...qualityMetrics, foreignMatter: parseFloat(e.target.value)})}
                        className="w-full accent-amber-600"
                      />
                    </div>

                    {/* Damaged Grain Slider */}
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                      <div className="flex justify-between items-center text-xs font-bold">
                        <span className="text-slate-700">{t.damagedGrain} (Limit: &lt;2.0%):</span>
                        <span className="text-sm font-mono px-2 py-0.5 rounded bg-slate-200 text-slate-800">
                          {qualityMetrics.damagedGrain}%
                        </span>
                      </div>
                      <input 
                        type="range" 
                        min="0.0" 
                        max="6.0" 
                        step="0.1"
                        value={qualityMetrics.damagedGrain}
                        onChange={e => setQualityMetrics({...qualityMetrics, damagedGrain: parseFloat(e.target.value)})}
                        className="w-full accent-amber-600"
                      />
                    </div>
                  </div>
                </div>

                {/* Right Result Card: Grade Evaluator & Payout */}
                <div className="lg:col-span-5 bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                  <h3 className="font-extrabold text-slate-900 text-base border-b border-slate-100 pb-2">Automated Payout Summary</h3>

                  <div className={`p-4 rounded-xl border text-center font-bold ${evaluatedGrade.statusClass}`}>
                    <div className="text-xs uppercase tracking-wider">Evaluated Quality Grade</div>
                    <div className="text-xl font-black mt-1">{evaluatedGrade.grade}</div>
                  </div>

                  <div className="space-y-2.5 text-xs text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div className="flex justify-between">
                      <span className="text-slate-500">Base MSP Rate:</span>
                      <span className="font-bold">₹{activeInspectionToken.baseMsp}/Qtl</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Crop Quantity:</span>
                      <span className="font-bold">{activeInspectionToken.weight} Quintals</span>
                    </div>
                    <div className="flex justify-between text-red-600">
                      <span>Quality Penalty Deduction:</span>
                      <span className="font-bold">- ₹{evaluatedGrade.penaltyPerQuintal}/Qtl</span>
                    </div>
                    <div className="border-t border-slate-200 pt-2 flex justify-between text-sm font-black text-slate-900">
                      <span>Net Farmer Payout:</span>
                      <span className="text-agri-700">
                        ₹{(evaluatedGrade.grade === "Rejected" ? 0 : (activeInspectionToken.baseMsp - evaluatedGrade.penaltyPerQuintal) * activeInspectionToken.weight).toLocaleString('en-IN')}
                      </span>
                    </div>
                  </div>

                  {qualityApprovedMsg && (
                    <div className="bg-emerald-50 border border-emerald-300 text-emerald-900 p-3 rounded-xl text-xs font-bold">
                      ✓ {qualityApprovedMsg}
                    </div>
                  )}

                  <button 
                    onClick={handleApproveQuality}
                    className="w-full bg-agri-600 hover:bg-agri-700 text-white font-extrabold py-3 rounded-xl shadow transition text-sm">
                    {t.approvePayment}
                  </button>
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* MODULE 6: MANDI TRAFFIC & QUEUE MANAGEMENT TABLE         */}
            {/* ======================================================== */}
            {role === 'officer' && activeTab === 'traffic' && (
              <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div>
                    <h2 className="text-xl font-black text-slate-900">{t.tabTraffic}</h2>
                    <p className="text-xs text-slate-500 mt-0.5">Real-time arrival queue, gate controls, and stage override actions.</p>
                  </div>
                  <div className="bg-emerald-50 border border-emerald-200 px-4 py-2 rounded-xl text-xs font-bold text-emerald-800">
                    Active Queue Count: {tokens.length} Vehicles
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                        <th className="p-3">Token ID</th>
                        <th className="p-3">Farmer Name</th>
                        <th className="p-3">Crop / Qtl</th>
                        <th className="p-3">Gate</th>
                        <th className="p-3">Current Stage</th>
                        <th className="p-3">Net Payout</th>
                        <th className="p-3 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 text-xs font-medium text-slate-800">
                      {tokens.map(tk => {
                        const stageNames = [t.stage1, t.stage2, t.stage3, t.stage4, t.stage5, t.stage6];
                        return (
                          <tr key={tk.id} className="hover:bg-slate-50/80 transition">
                            <td className="p-3 font-mono font-bold text-amber-700">{tk.id}</td>
                            <td className="p-3 font-bold text-slate-900">{tk.farmerName}</td>
                            <td className="p-3">{tk.crop} ({tk.weight} Q)</td>
                            <td className="p-3">{tk.gate}</td>
                            <td className="p-3">
                              <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                tk.stage === 6 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                              }`}>
                                Step {tk.stage}: {stageNames[tk.stage - 1]}
                              </span>
                            </td>
                            <td className="p-3 font-extrabold text-agri-800">₹{tk.netPayout.toLocaleString('en-IN')}</td>
                            <td className="p-3 text-right">
                              <button 
                                onClick={() => advanceStage(tk.id)}
                                className="bg-slate-800 hover:bg-slate-900 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg shadow transition">
                                Advance Stage →
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* MODULE 7: PREDICTIVE BOTTLENECK ANALYTICS (RECHARTS SVG)  */}
            {/* ======================================================== */}
            {role === 'officer' && activeTab === 'analytics' && (
              <div className="space-y-6">
                
                {/* Bottleneck Warning Banner */}
                <div className="bg-amber-50 border border-amber-300 p-4 rounded-2xl flex items-center gap-3">
                  <div className="bg-amber-500 text-white p-2.5 rounded-xl">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                  </div>
                  <div>
                    <h3 className="font-extrabold text-amber-900 text-sm">{t.trafficBottleneck}</h3>
                    <p className="text-xs text-amber-800 mt-0.5">Automated AI dispatch is re-routing 15% incoming tractors to Gate 3 & Gate 4 to balance weighbridge load.</p>
                  </div>
                </div>

                {/* Metrics Overview Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div className="text-xs font-bold text-slate-500 uppercase">Today's Total Procurement</div>
                    <div className="text-2xl font-black text-slate-900 mt-1">18,450 Qtl</div>
                    <div className="text-[11px] text-emerald-600 font-semibold mt-1">↑ 14% higher than yesterday</div>
                  </div>
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div className="text-xs font-bold text-slate-500 uppercase">{t.totalDisbursedToday}</div>
                    <div className="text-2xl font-black text-agri-700 mt-1">₹ 3,97,42,000</div>
                    <div className="text-[11px] text-slate-500 font-medium mt-1">100% Direct Bank Transfer (DBT)</div>
                  </div>
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div className="text-xs font-bold text-slate-500 uppercase">Average Turnaround Time</div>
                    <div className="text-2xl font-black text-amber-600 mt-1">24 Minutes</div>
                    <div className="text-[11px] text-emerald-600 font-semibold mt-1">↓ Reduced from 3.5 hours</div>
                  </div>
                </div>

                {/* VISUAL CHART 1: HOURLY ARRIVALS VS WEIGHBRIDGE CAPACITY */}
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-black text-slate-900 text-base">{t.capacityGraphTitle}</h3>
                    <div className="flex items-center gap-4 text-xs font-bold">
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 bg-agri-600 rounded"></span> Arrival Traffic</span>
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 bg-slate-300 rounded"></span> Weighbridge Limit</span>
                    </div>
                  </div>

                  {/* High Resolution SVG Hourly Chart */}
                  <div className="h-64 w-full bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between">
                    <div className="flex-1 flex items-end justify-between gap-2 px-2 pb-2 border-b border-slate-200">
                      {[
                        { time: "08 AM", arrival: 40, limit: 80 },
                        { time: "09 AM", arrival: 65, limit: 80 },
                        { time: "10 AM", arrival: 78, limit: 80 },
                        { time: "11 AM", arrival: 95, limit: 80, bottleneck: true },
                        { time: "12 PM", arrival: 92, limit: 80, bottleneck: true },
                        { time: "01 PM", arrival: 70, limit: 80 },
                        { time: "02 PM", arrival: 55, limit: 80 },
                        { time: "03 PM", arrival: 42, limit: 80 }
                      ].map((item, idx) => (
                        <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group relative">
                          {/* Tooltip on hover */}
                          <div className="absolute -top-8 bg-slate-900 text-white text-[10px] font-bold px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition">
                            {item.arrival} Tractors
                          </div>
                          <div className="w-full flex justify-center items-end gap-1 h-full">
                            <div 
                              className={`w-1/2 rounded-t-md transition-all ${item.bottleneck ? 'bg-amber-500' : 'bg-agri-600'}`}
                              style={{ height: `${(item.arrival / 100) * 100}%` }}>
                            </div>
                            <div 
                              className="w-1/2 bg-slate-300 rounded-t-md"
                              style={{ height: `${(item.limit / 100) * 100}%` }}>
                            </div>
                          </div>
                          <span className="text-[10px] font-bold text-slate-500 mt-2">{item.time}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* DAILY PROCUREMENT TARGET PROGRESS BAR */}
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                  <div className="flex justify-between items-center text-xs font-bold">
                    <span className="text-slate-800">{t.dailyTarget} (Target: 25,000 Quintals):</span>
                    <span className="text-agri-700">18,450 Quintals (73.8% Complete)</span>
                  </div>
                  <div className="w-full bg-slate-100 h-4 rounded-full overflow-hidden p-0.5 border border-slate-200">
                    <div className="bg-agri-600 h-full rounded-full transition-all duration-1000" style={{ width: '73.8%' }}></div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* --- FOOTER --- */}
          <footer className="bg-slate-900 text-slate-400 border-t border-slate-800 py-6 text-center text-xs">
            <div className="max-w-7xl mx-auto px-4 space-y-1">
              <p className="font-semibold text-slate-300">e-Mandi Suvidha — Smart Mandi Procurement & Queue Management System</p>
              <p className="text-slate-500">Designed with Agriculture Greenery Theme • Multi-Lingual Accessible Interface for Indian Farmers</p>
            </div>
          </footer>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MandiApp />);
  </script>
</body>
</html>
